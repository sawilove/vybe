name: Release

# Builds every platform and publishes a GitHub release with the notes from
# CHANGELOG.md. Start it either by pushing a tag like v0.1.0, or from the
# Actions tab ("Run workflow") with the version: the tag is then created on
# the selected commit. See docs/RELEASING.md.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 0.1.0 (must match pubspec.yaml)'
        required: true

permissions:
  contents: write

env:
  FLUTTER_VERSION: 3.50.0

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then tag="v${INPUT_VERSION#v}"; else tag="$GITHUB_REF_NAME"; fi
          tool/check_version.sh "$tag"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: android, os: ubuntu-latest }
          - { target: linux, os: ubuntu-latest }
          - { target: windows, os: windows-latest }
          - { target: macos, os: macos-latest }
          - { target: ios, os: macos-latest }
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get

      # ---------- Android ----------
      - if: matrix.target == 'android'
        uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - if: matrix.target == 'android'
        name: Set up release signing (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: the APK is signed with a throwaway debug key."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
          cat > android/key.properties <<PROPS
          storeFile=release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPS
      - if: matrix.target == 'android'
        run: |
          flutter build apk --release
          mkdir -p dist && cp build/app/outputs/flutter-apk/app-release.apk "dist/VYBE-${VERSION}-android.apk"

      # ---------- Linux ----------
      - if: matrix.target == 'linux'
        run: |
          sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libmpv-dev
          flutter build linux --release
          mkdir -p dist && tar -C build/linux/x64/release/bundle -czf "dist/VYBE-${VERSION}-linux-x64.tar.gz" .

      # ---------- Windows ----------
      - if: matrix.target == 'windows'
        shell: pwsh
        run: |
          flutter build windows --release
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath "dist/VYBE-$env:VERSION-windows-x64.zip"

      # ---------- macOS ----------
      - if: matrix.target == 'macos'
        run: |
          flutter build macos --release
          mkdir -p dist && ditto -c -k --keepParent build/macos/Build/Products/Release/vybe.app "dist/VYBE-${VERSION}-macos.zip"

      # ---------- iOS (unsigned, for sideloading) ----------
      - if: matrix.target == 'ios'
        run: |
          flutter build ios --release --no-codesign
          mkdir -p dist Payload && cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr "dist/VYBE-${VERSION}-ios-unsigned.ipa" Payload

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  publish:
    needs: [verify, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - run: tool/release_notes.sh "${{ needs.verify.outputs.version }}" > notes.md
      - run: (cd dist && sha256sum * > SHA256SUMS.txt)
      - uses: softprops/action-gh-release@v2
        with:
          name: VYBE ${{ needs.verify.outputs.version }}
          tag_name: v${{ needs.verify.outputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: notes.md
          files: dist/*
          prerelease: ${{ contains(github.ref_name, '-') }}
